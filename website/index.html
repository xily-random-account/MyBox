        /* --- Toast Animation Implementation --- 
           Drives the logo up from the bottom, holds it in place, and slides it back down. */
        .boot-logo-container {
            font-size: 5rem;
            margin-bottom: 24px;
            will-change: transform, opacity;
            /* Animation duration matches our execution window precisely */
            animation: toast-lifecycle 2.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes toast-lifecycle {
            0% {
                opacity: 0;
                transform: translateY(120px) scale(0.7);
            }
            /* Slides up and stands completely still by 15% */
            15% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            /* Stable plateau window */
            80% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            /* Toast dismissal drop back down past the bottom viewport edge */
            100% {
                opacity: 0;
                transform: translateY(150px) scale(0.8);
            }
        }

        /* --- Booting Subtext Typography --- */
        .boot-text {
            font-family: monospace;
            color: #00ffcc; /* Vibrant synth terminal aqua */
            font-size: 1.1rem;
            letter-spacing: 3px;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .boot-text.reveal {
            opacity: 0.85;
            transform: scale(1);
        }
    </style>

<body>

    <!-- Startup Branding / Animations Context -->
    <div class="boot-logo-container">🎛️</div>
    <div id="boot-status-text" class="boot-text">SLARMOOS-BOX INITIALIZING...</div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const bootText = document.getElementById("boot-status-text");

            // 1. Reveal the status text smoothly right after the toast enters the frame
            setTimeout(() => {
                if (bootText) bootText.classList.add("reveal");
            }, 350);

            // 2. Perform redirection right as the logo finishes moving off-screen
            setTimeout(() => {
                window.location.href = "editor.html";
            }, 2150); // Fires cleanly near the end of the 2.2s toast-lifecycle
        });
    </script>
